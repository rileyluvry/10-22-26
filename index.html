<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Angie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --kraft:#b89a74; --kraft-dark:#9c7f5b; --ink:#4a3424; --paper:#faf3df; --berry:#c9456b;
  --P:min(calc((100vw - 24px) / 2), calc((100dvh - 215px) * 0.6441));
  --H:calc(var(--P) * 1.5525);
  --ease:cubic-bezier(.65,.05,.25,1);
  font-family:'Gaegu','Comic Sans MS','Chalkboard SE',cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  color:var(--ink);overflow:hidden;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,240,205,.35),transparent 60%),
    radial-gradient(ellipse at 80% 90%,rgba(90,60,30,.25),transparent 55%),
    repeating-linear-gradient(35deg,rgba(255,255,255,.03) 0 2px,rgba(0,0,0,.025) 2px 4px),
    var(--kraft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(34px,6dvh) 12px 12px;
}
.stage{perspective:2400px;width:calc(var(--P)*2);height:var(--H);flex:none;position:relative}
.book{position:absolute;inset:0;transition:transform 1.1s var(--ease);transform:translateX(calc(var(--P) * -.5))}
.book.open{transform:translateX(0)}
.page,.leaf{position:absolute;top:0;width:var(--P);height:var(--H)}
.page.right{left:var(--P);box-shadow:0 14px 30px rgba(50,30,10,.35)}
.page img.bg,.face img.bg{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.leaf{left:var(--P);transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s var(--ease);z-index:2}
.book.open .leaf{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 14px 30px rgba(50,30,10,.35);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.cover-btn{all:unset;display:block;width:100%;height:100%;cursor:pointer}
.cover-btn:focus-visible,button.ui:focus-visible,.letter:focus-visible{outline:3px dashed var(--berry);outline-offset:3px}
.book.open .cover-btn{pointer-events:none}

/* letter */
.letter{position:absolute;left:15.25%;top:15.94%;width:68.9%;height:71.2%;cursor:pointer;border:0;padding:0;background:none;
  opacity:0;transform:none;transition:opacity .3s,transform .6s cubic-bezier(.3,1.3,.5,1),box-shadow .4s;z-index:3;-webkit-tap-highlight-color:transparent}
.letter img{width:100%;height:100%;display:block;pointer-events:none}
.letter.lifted{opacity:1;transform:translateY(-1.5%) scale(1.13) rotate(-1.2deg);box-shadow:0 18px 34px rgba(40,22,8,.5)}
.letter:not(.lifted){box-shadow:none}

/* candles */
.flame{position:absolute;transform-origin:50% 96%;will-change:transform;pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(255,200,90,.7));transition:opacity .35s,filter .35s}
.flame.out{opacity:0;filter:none}
.wish{position:absolute;left:8%;right:8%;top:34%;text-align:center;font-size:calc(var(--P)*.085);font-weight:700;line-height:1;color:var(--ink);
  background:#efe4cc;padding:.45em .5em .5em;box-shadow:0 4px 10px rgba(50,30,10,.3);transform:rotate(-2deg) scale(.6);opacity:0;pointer-events:none;
  transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .3s;clip-path:polygon(0 4%,3% 0,97% 3%,100% 0,100% 96%,97% 100%,3% 97%,0 100%)}
.wish.show{opacity:1;transform:rotate(-2deg) scale(1)}
.wish small{display:block;font-size:.55em;font-weight:400;margin-top:.2em}

/* controls */
.bar{margin-top:18px;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .4s .5s}
.bar.show{opacity:1;pointer-events:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
button.ui{font:inherit;font-size:19px;font-weight:700;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:14px 10px 15px 9px;
  padding:6px 16px;cursor:pointer;box-shadow:2px 3px 0 var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
button.ui:active,button.ui.held{transform:translate(2px,3px);box-shadow:0 0 0 var(--ink)}
button.ui.accent{background:#f4b6c8}
.meter{display:flex;align-items:center;gap:8px;font-size:17px}
.meter .track{width:130px;height:14px;border:2px solid var(--ink);border-radius:9px;background:var(--paper);overflow:hidden;position:relative}
.meter .fill{height:100%;width:0;background:linear-gradient(90deg,#8bc48a,#f0c75e,#e5604f)}
.meter .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.6}
.status{font-size:17px;max-width:min(92vw,560px);text-align:center;min-height:1.2em}
.hint{margin-top:16px;font-size:22px;font-weight:700;transition:opacity .4s}
.hint.gone{opacity:0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.book,.leaf{transition-duration:.01s}}
</style>
</head>

<div class="hint" id="hint">tap the card to open</div>

<div class="bar" id="bar">
  <div class="row">
    <button class="ui" id="back">back to cover</button>
    <button class="ui accent" id="hold" aria-label="Hold to blow out the candles">hold to blow</button>
    <button class="ui" id="relight" hidden>relight</button>
  </div>
  <div class="row">
    <div class="meter" aria-hidden="true"><span>mic</span><div class="track"><div class="fill" id="fill"></div><div class="mark" id="mark"></div></div></div>
    <label class="meter">sensitivity <input type="range" id="sens" min="0" max="100" value="55"></label>
  </div>
  <div class="status" id="status" role="status"></div>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var book=$('book'),bar=$('bar'),letter=$('letter'),status=$('status'),fill=$('fill'),mark=$('mark');
  var flames=[0,1,2].map(function(i){return $('fl'+i)});
  var isOpen=false;

  /* ---------- open / close ---------- */
  function openCard(){
    if(isOpen)return; isOpen=true; book.classList.add('open'); bar.classList.add('show'); $('hint').classList.add('gone'); startMic();
  }
  function closeCard(){
    if(!isOpen)return; isOpen=false; book.classList.remove('open'); bar.classList.remove('show'); $('hint').classList.remove('gone');
    setLetter(false); manual=false; $('hold').classList.remove('held');
  }
  $('cover').addEventListener('click',openCard);
  $('back').addEventListener('click',closeCard);

  /* ---------- letter ---------- */
  function setLetter(on){letter.classList.toggle('lifted',on);letter.setAttribute('aria-expanded',on);
    letter.setAttribute('aria-label',on?'Tuck the letter back into the envelope':'Read the letter');}
  letter.addEventListener('click',function(){setLetter(!letter.classList.contains('lifted'))});

  /* ---------- microphone ---------- */
  var ac,analyser,buf,micOn=false,micTried=false,floor=0.004;
  function say(t){status.textContent=t}
  function startMic(){
    if(micOn||micTried&&ac)return; micTried=true;
    if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      say('Mic needs https. Hold the button or press space to blow.');return;}
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
      var AC=window.AudioContext||window.webkitAudioContext; ac=new AC();
      var src=ac.createMediaStreamSource(s); analyser=ac.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.3;
      src.connect(analyser); buf=new Float32Array(analyser.fftSize); micOn=true;
      if(ac.state==='suspended')ac.resume();
      say('Mic is on. Blow on your phone or laptop mic!');
    }).catch(function(){say('Mic blocked. Hold the button or press space to blow.');micTried=false;});
  }
  function micLevel(){
    if(!micOn)return 0;
    analyser.getFloatTimeDomainData(buf);
    var s=0;for(var i=0;i<buf.length;i++)s+=buf[i]*buf[i];
    var rms=Math.sqrt(s/buf.length);
    floor=rms<floor*2?floor*.98+rms*.02:floor;           /* slowly track room noise */
    return Math.max(0,rms-floor*1.5);
  }

  /* ---------- hold to blow fallback ---------- */
  var manual=false,hold=$('hold');
  function setManual(v){manual=v;hold.classList.toggle('held',v)}
  hold.addEventListener('pointerdown',function(e){e.preventDefault();setManual(true)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(t){hold.addEventListener(t,function(){setManual(false)})});
  hold.addEventListener('contextmenu',function(e){e.preventDefault()});
  addEventListener('keydown',function(e){if(e.code==='Space'&&isOpen){e.preventDefault();setManual(true)}});
  addEventListener('keyup',function(e){if(e.code==='Space')setManual(false)});

  /* ---------- flames ---------- */
  var blowT=0,out=false,last=performance.now(),smooth=0,wob=0;
  function threshold(){return 0.012+(1-$('sens').value/100)*0.09}      /* rms needed to count as blowing */
  mark.style.left='20%';
  function frame(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;wob+=dt*14;
    var lv=micLevel(),thr=threshold();
    var blowing=manual||lv>thr;
    var strength=manual?0.8:Math.min(1,lv/(thr*3));
    smooth+=((blowing?strength:0)-smooth)*Math.min(1,dt*12);
    fill.style.width=Math.min(100,(manual?80:lv/(thr*5)*100))+'%';
    mark.style.left=Math.min(100,20)+'%';
    if(!out){
      blowT=blowing?blowT+dt:Math.max(0,blowT-dt*1.5);
      flames.forEach(function(f,i){
        var idle=Math.sin(wob*.6+i*2)*1.6;
        var bend=smooth*(34+Math.sin(wob+i)*6);
        var sq=1-smooth*.18;
        f.style.transform='rotate('+(idle+bend)+'deg) scaleY('+sq+') skewX('+(-bend*.5)+'deg)';
      });
      if(blowT>=0.5)blowOut();
    }
    requestAnimationFrame(frame);
  }
  function blowOut(){
    out=true;
    flames.forEach(function(f,i){setTimeout(function(){f.classList.add('out')},i*90)});
    setTimeout(function(){$('wish').classList.add('show');$('relight').hidden=false;$('hold').hidden=true;confetti();},350);
    say('');
  }
  $('relight').addEventListener('click',function(){
    out=false;blowT=0;smooth=0;$('wish').classList.remove('show');$('relight').hidden=true;$('hold').hidden=false;
    flames.forEach(function(f){f.classList.remove('out')});
    if(micOn)say('Mic is on. Blow again!');
  });
  requestAnimationFrame(frame);

  /* ---------- confetti ---------- */
  var cv=$('confetti'),cx=cv.getContext('2d'),parts=[],run=false;
  function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
  size();addEventListener('resize',size);
  function confetti(){
    var cols=['#e8607a','#f4b6c8','#f0c75e','#7fb7e0','#8bc48a','#b58bd9','#fff'];
    var r=$('rightPage').getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height*.3;
    for(var i=0;i<140;i++){var a=Math.random()*Math.PI*2,v=4+Math.random()*9;
      parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,w:6+Math.random()*7,h:4+Math.random()*6,
        rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1});}
    if(!run){run=true;requestAnimationFrame(tick)}
  }
  function tick(){
    cx.clearRect(0,0,cv.width,cv.height);var d=devicePixelRatio;
    parts=parts.filter(function(p){return p.life>0&&p.y<innerHeight+30});
    parts.forEach(function(p){
      p.vy+=.25;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.004;
      cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.rot);cx.globalAlpha=Math.min(1,p.life*3);
      cx.fillStyle=p.c;cx.fillRect(-p.w*d/2,-p.h*d/2,p.w*d,p.h*d);cx.restore();});
    if(parts.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
  }
})();
</script>
</body>
</html>
